name: "JumpCloud"
command: "jumpcloud-auth-provider/bin/obot-provider"
icon: "https://jumpcloud.com/wp-content/themes/jumpcloud/assets/images/favicons/android-icon-192x192-light.png"
description: "Auth provider for JumpCloud"
locales:
  ja:
    name: "JumpCloud"
    description: "JumpCloud の認証プロバイダー"
  ko:
    name: "JumpCloud"
    description: "JumpCloud 인증 공급자"
  zh-CN:
    name: "JumpCloud"
    description: "JumpCloud 身份验证提供方"
link: "https://jumpcloud.com/"
requiredEntitlements:
  - "OBOT_ENTERPRISE_AUTH_PROVIDERS"
requiredConfigurationParameters:
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_CLIENT_ID"
    friendlyName: "Client ID"
    description: "Client ID for your JumpCloud custom OIDC application."
    locales:
      ja:
        friendlyName: "クライアント ID"
        description: "JumpCloud カスタム OIDC アプリケーションのクライアント ID。"
      ko:
        friendlyName: "클라이언트 ID"
        description: "JumpCloud 사용자 지정 OIDC 애플리케이션의 클라이언트 ID입니다."
      zh-CN:
        friendlyName: "客户端 ID"
        description: "JumpCloud 自定义 OIDC 应用的客户端 ID。"
    sensitive: false
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_CLIENT_SECRET"
    friendlyName: "Client Secret"
    description: "Client secret for your JumpCloud custom OIDC application."
    locales:
      ja:
        friendlyName: "クライアントシークレット"
        description: "JumpCloud カスタム OIDC アプリケーションのクライアントシークレット。"
      ko:
        friendlyName: "클라이언트 보안 비밀"
        description: "JumpCloud 사용자 지정 OIDC 애플리케이션의 클라이언트 보안 비밀입니다."
      zh-CN:
        friendlyName: "客户端密钥"
        description: "JumpCloud 自定义 OIDC 应用的客户端密钥。"
    sensitive: true
  - name: "OBOT_AUTH_PROVIDER_EMAIL_DOMAINS"
    friendlyName: "Allowed E-Mail Domains"
    description: "A list of email domains that are allowed to authenticate with this provider. * is a special value that allows all domains."
    locales:
      ja:
        friendlyName: "許可するメールドメイン"
        description: "このプロバイダーで認証を許可するメールドメインの一覧です。* を指定するとすべてのドメインを許可します。"
      ko:
        friendlyName: "허용할 이메일 도메인"
        description: "이 공급자로 인증할 수 있는 이메일 도메인 목록입니다. *를 지정하면 모든 도메인을 허용합니다."
      zh-CN:
        friendlyName: "允许的电子邮件域名"
        description: "允许通过此提供方进行身份验证的电子邮件域名列表。* 表示允许所有域名。"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_COOKIE_SECRET"
    friendlyName: "Cookie Secret"
    description: "Secret used to encrypt cookies. Must be a random string of length 16, 24, or 32."
    locales:
      ja:
        friendlyName: "Cookie シークレット"
        description: "Cookie の暗号化に使用するシークレット。長さが 16、24、または 32 文字のランダムな文字列にしてください。"
      ko:
        friendlyName: "쿠키 보안 비밀"
        description: "쿠키 암호화에 사용하는 보안 비밀입니다. 길이가 16, 24 또는 32인 임의 문자열이어야 합니다."
      zh-CN:
        friendlyName: "Cookie 密钥"
        description: "用于加密 Cookie 的密钥。必须是长度为 16、24 或 32 的随机字符串。"
    sensitive: true
    hidden: true
optionalConfigurationParameters:
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_SERVICE_ACCOUNT_CLIENT_ID"
    friendlyName: "Service Account Client ID"
    description: "Client ID for a JumpCloud API service account. Configure this and the matching service account client secret to use service-account authentication instead of an API key."
    locales:
      ja:
        friendlyName: "サービスアカウントのクライアント ID"
        description: "JumpCloud API サービスアカウントのクライアント ID。API キーの代わりにサービスアカウント認証を使用するには、対応するクライアントシークレットとともに設定してください。"
      ko:
        friendlyName: "서비스 계정 클라이언트 ID"
        description: "JumpCloud API 서비스 계정의 클라이언트 ID입니다. API 키 대신 서비스 계정 인증을 사용하려면 일치하는 클라이언트 보안 비밀과 함께 설정하세요."
      zh-CN:
        friendlyName: "服务账户客户端 ID"
        description: "JumpCloud API 服务账户的客户端 ID。要使用服务账户身份验证代替 API 密钥，请同时配置对应的客户端密钥。"
    sensitive: false
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_SERVICE_ACCOUNT_CLIENT_SECRET"
    friendlyName: "Service Account Client Secret"
    description: "Client secret for a JumpCloud API service account. Configure this and the matching service account client ID to use service-account authentication instead of an API key."
    locales:
      ja:
        friendlyName: "サービスアカウントのクライアントシークレット"
        description: "JumpCloud API サービスアカウントのクライアントシークレット。API キーの代わりにサービスアカウント認証を使用するには、対応するクライアント ID とともに設定してください。"
      ko:
        friendlyName: "서비스 계정 클라이언트 보안 비밀"
        description: "JumpCloud API 서비스 계정의 클라이언트 보안 비밀입니다. API 키 대신 서비스 계정 인증을 사용하려면 일치하는 클라이언트 ID와 함께 설정하세요."
      zh-CN:
        friendlyName: "服务账户客户端密钥"
        description: "JumpCloud API 服务账户的客户端密钥。要使用服务账户身份验证代替 API 密钥，请同时配置对应的客户端 ID。"
    sensitive: true
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_API_KEY"
    friendlyName: "API Key"
    description: "JumpCloud API key used to list groups, inspect user memberships, and verify account status. Use this if you are not using the service-account client ID and client secret above."
    locales:
      ja:
        friendlyName: "API キー"
        description: "グループ一覧、ユーザーの所属、アカウント状態の確認に使用する JumpCloud API キー。上記のサービスアカウントのクライアント ID とシークレットを使用しない場合に指定します。"
      ko:
        friendlyName: "API 키"
        description: "그룹 목록, 사용자 소속 및 계정 상태를 확인하는 JumpCloud API 키입니다. 위의 서비스 계정 클라이언트 ID와 보안 비밀을 사용하지 않을 때 지정하세요."
      zh-CN:
        friendlyName: "API 密钥"
        description: "用于列出用户组、检查用户成员关系并验证账户状态的 JumpCloud API 密钥。不使用上面的服务账户客户端 ID 和密钥时请填写此项。"
    sensitive: true
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_API_ORG_ID"
    friendlyName: "Org ID"
    description: "Optional JumpCloud org ID header for multi-tenant API requests."
    locales:
      ja:
        friendlyName: "組織 ID"
        description: "マルチテナント API リクエストに使用する任意の JumpCloud 組織 ID ヘッダー。"
      ko:
        friendlyName: "조직 ID"
        description: "다중 테넌트 API 요청에 사용할 선택적 JumpCloud 조직 ID 헤더입니다."
      zh-CN:
        friendlyName: "组织 ID"
        description: "用于多租户 API 请求的可选 JumpCloud 组织 ID 标头。"
    sensitive: false
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_ISSUER_URL"
    friendlyName: "Issuer URL"
    description: "JumpCloud OIDC issuer URL. Default: https://oauth.id.jumpcloud.com/"
    locales:
      ja:
        friendlyName: "発行者 URL"
        description: "JumpCloud OIDC の発行者 URL。既定値: https://oauth.id.jumpcloud.com/"
      ko:
        friendlyName: "발급자 URL"
        description: "JumpCloud OIDC 발급자 URL입니다. 기본값: https://oauth.id.jumpcloud.com/"
      zh-CN:
        friendlyName: "颁发者 URL"
        description: "JumpCloud OIDC 颁发者 URL。默认值：https://oauth.id.jumpcloud.com/"
    sensitive: false
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_API_BASE_URL"
    friendlyName: "API Base URL"
    description: "JumpCloud API base URL. Default: https://console.jumpcloud.com. Customers using the EU data center should set this to https://console.eu.jumpcloud.com."
    locales:
      ja:
        friendlyName: "API ベース URL"
        description: "JumpCloud API のベース URL。既定値: https://console.jumpcloud.com。EU データセンターの利用者は https://console.eu.jumpcloud.com を指定してください。"
      ko:
        friendlyName: "API 기본 URL"
        description: "JumpCloud API 기본 URL입니다. 기본값: https://console.jumpcloud.com. EU 데이터 센터 고객은 https://console.eu.jumpcloud.com을 설정하세요."
      zh-CN:
        friendlyName: "API 基础 URL"
        description: "JumpCloud API 的基础 URL。默认值：https://console.jumpcloud.com。使用欧盟数据中心的客户应设为 https://console.eu.jumpcloud.com。"
    sensitive: false
  - name: "OBOT_JUMPCLOUD_AUTH_PROVIDER_SERVICE_ACCOUNT_TOKEN_URL"
    friendlyName: "Service Account Token URL"
    description: "OAuth token endpoint for JumpCloud service-account client-credentials exchanges. Use this with the service account fields above. Default: https://admin-oauth.id.jumpcloud.com/oauth2/token. Override this if your JumpCloud region uses a different admin OAuth endpoint."
    locales:
      ja:
        friendlyName: "サービスアカウントのトークン URL"
        description: "JumpCloud サービスアカウントのクライアント認証情報交換に使用する OAuth トークンエンドポイント。上記のサービスアカウント設定と併用します。既定値: https://admin-oauth.id.jumpcloud.com/oauth2/token。地域で別の管理 OAuth エンドポイントを使用する場合は変更してください。"
      ko:
        friendlyName: "서비스 계정 토큰 URL"
        description: "JumpCloud 서비스 계정의 클라이언트 자격 증명 교환에 사용할 OAuth 토큰 엔드포인트입니다. 위의 서비스 계정 필드와 함께 사용합니다. 기본값: https://admin-oauth.id.jumpcloud.com/oauth2/token. 지역에서 다른 관리자 OAuth 엔드포인트를 사용하는 경우 변경하세요."
      zh-CN:
        friendlyName: "服务账户令牌 URL"
        description: "用于 JumpCloud 服务账户客户端凭据交换的 OAuth 令牌端点。与上述服务账户字段一起使用。默认值：https://admin-oauth.id.jumpcloud.com/oauth2/token。如果所在区域使用其他管理员 OAuth 端点，请覆盖此值。"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_DSN"
    friendlyName: "PostgreSQL connection string (DSN)"
    description: "The connection string for a PostgreSQL database to use for session storage. If unset, cookies will be used for session storage instead."
    locales:
      ja:
        friendlyName: "PostgreSQL 接続文字列 (DSN)"
        description: "セッション保存に使用する PostgreSQL データベースの接続文字列です。未設定の場合は Cookie にセッションを保存します。"
      ko:
        friendlyName: "PostgreSQL 연결 문자열(DSN)"
        description: "세션 저장에 사용할 PostgreSQL 데이터베이스 연결 문자열입니다. 설정하지 않으면 쿠키에 세션을 저장합니다."
      zh-CN:
        friendlyName: "PostgreSQL 连接字符串 (DSN)"
        description: "用于存储会话的 PostgreSQL 数据库连接字符串。未设置时改用 Cookie 存储会话。"
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_CONNECTIONS"
    friendlyName: "PostgreSQL max open connections"
    description: "The maximum number of open connections to the PostgreSQL database."
    locales:
      ja:
        friendlyName: "PostgreSQL 最大オープン接続数"
        description: "PostgreSQL データベースへの最大オープン接続数です。"
      ko:
        friendlyName: "PostgreSQL 최대 열린 연결 수"
        description: "PostgreSQL 데이터베이스의 최대 열린 연결 수입니다."
      zh-CN:
        friendlyName: "PostgreSQL 最大打开连接数"
        description: "PostgreSQL 数据库允许的最大打开连接数。"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_IDLE_CONNECTIONS"
    friendlyName: "PostgreSQL max idle connections"
    description: "The maximum number of idle connections to the PostgreSQL database."
    locales:
      ja:
        friendlyName: "PostgreSQL 最大アイドル接続数"
        description: "PostgreSQL データベースへの最大アイドル接続数です。"
      ko:
        friendlyName: "PostgreSQL 최대 유휴 연결 수"
        description: "PostgreSQL 데이터베이스의 최대 유휴 연결 수입니다."
      zh-CN:
        friendlyName: "PostgreSQL 最大空闲连接数"
        description: "PostgreSQL 数据库允许的最大空闲连接数。"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_LIFETIME_SECONDS"
    friendlyName: "PostgreSQL connection lifetime"
    description: "The maximum lifetime of a PostgreSQL database connection, in seconds."
    locales:
      ja:
        friendlyName: "PostgreSQL 接続の有効期間"
        description: "PostgreSQL データベース接続の最大有効期間（秒）。"
      ko:
        friendlyName: "PostgreSQL 연결 수명"
        description: "PostgreSQL 데이터베이스 연결의 최대 수명(초)입니다."
      zh-CN:
        friendlyName: "PostgreSQL 连接生存时间"
        description: "PostgreSQL 数据库连接的最长生存时间，以秒为单位。"
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_TOKEN_REFRESH_DURATION"
    friendlyName: "Token Refresh Duration"
    description: "Time to wait before attempting to refresh auth tokens. Should be in a format like 1h1m1s. Default: 1h"
    locales:
      ja:
        friendlyName: "トークン更新間隔"
        description: "認証トークンの更新を試みるまでの待機時間です。1h1m1s のような形式で指定します。既定値: 1h"
      ko:
        friendlyName: "토큰 갱신 간격"
        description: "인증 토큰 갱신을 시도하기 전 대기 시간입니다. 1h1m1s와 같은 형식으로 지정합니다. 기본값: 1h"
      zh-CN:
        friendlyName: "令牌刷新间隔"
        description: "尝试刷新身份验证令牌前的等待时间。格式如 1h1m1s。默认值：1h"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_ENABLE_LOGGING"
    friendlyName: "Enable Logging"
    description: "Set to true to enable request, auth, and standard logging for the auth provider. Default: false"
    locales:
      ja:
        friendlyName: "ログ記録を有効化"
        description: "true にすると認証プロバイダーのリクエスト、認証、標準ログを有効にします。既定値: false"
      ko:
        friendlyName: "로깅 활성화"
        description: "true로 설정하면 인증 공급자의 요청, 인증 및 표준 로깅을 활성화합니다. 기본값: false"
      zh-CN:
        friendlyName: "启用日志记录"
        description: "设为 true 可启用身份验证提供方的请求、身份验证和标准日志。默认值：false"
    sensitive: false
postgresTablePrefix: "jumpcloud_"
groupIDPrefix: "jumpcloud/"
