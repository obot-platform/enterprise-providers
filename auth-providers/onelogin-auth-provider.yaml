name: "OneLogin"
command: "onelogin-auth-provider/bin/obot-provider"
icon: "/admin/assets/onelogin_icon.png"
iconDark: "/admin/assets/onelogin_icon_dark.png"
description: "Auth provider for OneLogin"
link: "https://www.onelogin.com/"
requiredEntitlements:
  - "OBOT_ENTERPRISE_AUTH_PROVIDERS"
requiredConfigurationParameters:
  - name: "OBOT_ONELOGIN_AUTH_PROVIDER_CLIENT_ID"
    friendlyName: "Client ID"
    description: "Client ID for your OneLogin OpenID Connect (OIDC) app. Can be found in the OneLogin admin console under Applications > your app > SSO"
    sensitive: false
  - name: "OBOT_ONELOGIN_AUTH_PROVIDER_CLIENT_SECRET"
    friendlyName: "Client Secret"
    description: "Client secret for your OneLogin OpenID Connect (OIDC) app. Can be found in the OneLogin admin console under Applications > your app > SSO"
    sensitive: true
  - name: "OBOT_ONELOGIN_AUTH_PROVIDER_ISSUER_URL"
    friendlyName: "Issuer URL"
    description: "Issuer URL for your OneLogin OIDC app. Should be https://{your-subdomain}.onelogin.com/oidc/2"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_COOKIE_SECRET"
    friendlyName: "Cookie Secret"
    description: "Secret used to encrypt cookies. Must be a random string of length 16, 24, or 32."
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_EMAIL_DOMAINS"
    friendlyName: "Allowed E-Mail Domains"
    description: "A list of email domains that are allowed to authenticate with this provider. * is a special value that allows all domains."
    sensitive: false
optionalConfigurationParameters:
  - name: "OBOT_ONELOGIN_AUTH_PROVIDER_API_CLIENT_ID"
    friendlyName: "API Client ID"
    description: "Client ID for a OneLogin API credential with Read Users access. This is separate from the OIDC app. Create it in the OneLogin admin console under Developers > API Credentials. Required for directory synchronization; leave it and the API Client Secret unset when Obot provisions users and groups through SCIM."
    sensitive: false
  - name: "OBOT_ONELOGIN_AUTH_PROVIDER_API_CLIENT_SECRET"
    friendlyName: "API Client Secret"
    description: "Client secret for the OneLogin API credential. Create it in the OneLogin admin console under Developers > API Credentials. Set it together with the API Client ID, or leave both unset."
    sensitive: true
  - name: "OBOT_ONELOGIN_AUTH_PROVIDER_API_BASE_URL"
    friendlyName: "API Base URL"
    description: "Base URL of the OneLogin API. Defaults to the scheme and host of the Issuer URL, such as https://{your-subdomain}.onelogin.com. Set it only to use a regional API host such as https://api.us.onelogin.com or https://api.eu.onelogin.com."
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_DSN"
    friendlyName: "PostgreSQL connection string (DSN)"
    description: "The connection string for a PostgreSQL database to use for session storage. If unset, cookies will be used for session storage instead."
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_CONNECTIONS"
    friendlyName: "PostgreSQL max open connections"
    description: "The maximum number of open connections to the PostgreSQL database."
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_IDLE_CONNECTIONS"
    friendlyName: "PostgreSQL max idle connections"
    description: "The maximum number of idle connections to the PostgreSQL database."
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_LIFETIME_SECONDS"
    friendlyName: "PostgreSQL connection lifetime"
    description: "The maximum lifetime of a PostgreSQL database connection, in seconds."
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_TOKEN_REFRESH_DURATION"
    friendlyName: "Token Refresh Duration"
    description: "Time to wait before attempting to refresh auth tokens. Should be in a format like 1h1m1s. Default: 1h"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_ENABLE_LOGGING"
    friendlyName: "Enable Logging"
    description: "Set to true to enable request, auth, and standard logging for the auth provider. Default: false"
    sensitive: false
postgresTablePrefix: "onelogin_"
groupIDPrefix: "onelogin/"
